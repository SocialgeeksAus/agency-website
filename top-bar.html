}
.clone-top-bar .clone-top-bar-container {
  width: 100%;
  max-width: 1248px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-sizing: border-box;
}
.clone-top-bar .clone-top-bar-message {

  color: #FFFFFF;

}
.clone-top-bar .clone-top-bar-socials {

}
.clone-top-bar .clone-top-bar-social-link {

  text-decoration: none;
  border-radius: 4px;
  transition: color 0.2s ease;
}
.clone-top-bar .clone-top-bar-social-link:hover {
  color: #FFFFFF;
}
.clone-top-bar .clone-top-bar-social-link:focus-visible {
  outline: 2px solid #FFFFFF;
  outline-offset: 3px;
}
.clone-top-bar .clone-top-bar-social-icon {
  width: 14px;
  height: 14px;
  display: block;
  fill: currentColor;
}
@container (max-width: 768px) {
  .clone-top-bar .clone-top-bar-container {
    flex-direction: column;

  }
  .clone-top-bar .clone-top-bar-message {

  .clone-top-bar .clone-top-bar-socials {
    gap: 4px;
  }
  .clone-top-bar .clone-top-bar-social-link {
    width: 40px;
    height: 40px;
  }
}
@container (max-width: 600px) {
  .clone-top-bar .clone-top-bar-container {
    padding: 0 20px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .clone-top-bar .clone-top-bar-social-link { transition: none; }
}
/* Any touch screen (phones and tablets, including iPads in landscape) */
@media (pointer: coarse) {
  .clone-top-bar .clone-top-bar-socials { gap: 4px; }
  .clone-top-bar .clone-top-bar-social-link { width: 40px; height: 40px; }
}
</style>
