<style>

.sgd-cq { container-type: inline-size; width: 100%; max-width: 100%; }

.sgd-reviews {

.sgd-reviews-inner {

.sgd-reviews-title {

.sgd-review-author {

}
.sgd-review-business {

  color: #C9CED6;
}
@container (max-width: 900px) {

}
@container (max-width: 600px) {
